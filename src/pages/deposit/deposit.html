<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alke Wallet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <!-- nav -->
    <div class="container">
      <header class="">
        <nav class="navbar navbar-expand-lg bg-white">
          <div class="container-fluid">
            <a class="navbar-brand text-primary" href="index.html"
              >Alke Wallet</a
            >
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <div class="btn-group">
                  <button
                    type="button"
                    class="btn btn-primary position-relative dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    Perfil
                    <span
                      class="position-absolute top-0 start-100 translate-middle p-2 bg-success border border-light rounded-circle"
                    >
                      <span class="visually-hidden">New alerts</span>
                    </span>
                  </button>

                  <ul class="dropdown-menu">
                    <li>
                      <a class="dropdown-item" href="../../../index.html"
                        >Cerrar Sesión</a
                      >
                    </li>
                  </ul>
                </div>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <!-- hero -->
      <main class="">
        <section
          class="hero d-flex flex-column justify-content-center align-items-center p-5 text-white rounded rounded-5 border shadow my-5"
        >
          <h2 class="text-black text-center text-md-start mb-4">Depositar</h2>

          <div
            class="card shadow-sm rounded-4 border"
            style="max-width: 520px; width: 100%"
          >
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <small class="text-muted">Saldo actual</small>
                  <div class="fs-3 fw-bold text-dark" id="saldo-actual">$0</div>
                </div>

                <a
                  href="../app/menu.html"
                  class="btn btn-outline-secondary btn-sm"
                >
                  <i class="bi bi-arrow-left"></i> Volver
                </a>
              </div>

              <hr />

              <form id="form-deposito" class="mt-3">
                <label for="monto" class="form-label text-black"
                  >Monto a depositar</label
                >

                <div class="input-group mb-3">
                  <span class="input-group-text">$</span>
                  <input
                    type="number"
                    class="form-control"
                    id="monto"
                    placeholder="Ej: 10000"
                    min="1"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Confirmar depósito
                </button>
              </form>

              <div
                id="spinner"
                class="spinner-border text-primary mt-3"
                role="status"
              >
                <span class="visually-hidden">Loading...</span>
              </div>

              <div id="mensaje-alerta" class="alert mt-3" role="alert"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="./deposit.js"></script>
  </body>
</html>
